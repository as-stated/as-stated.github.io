name: Materialize TA-2026-015 technical note

on:
  push:
    branches:
      - publish-ta-2026-015
    paths:
      - .github/workflows/materialize-ta015.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-ta-2026-015
      - name: Fetch exact archived PDF
        run: |
          mkdir -p content/published/files/technical-notes/ancova-randomization-interval
          curl --fail --location --silent --show-error \
            'https://uc98b863c293a8bd21cfe2bc9829.dl.dropboxusercontent.com/cd/0/get/DMFGmavZvIpfbkWR6Dh0KjCKAXIGmF09JIS8uAICmlBiw9eaTyUkUcU3T6PVAJ_JYakX09cwl6NhH9qbv186U8DzKOu6fImY_pxeq6lQwg_SSh-LivUBVd0I9hJvChOAvmITDrdbXNMRRvG_FcV-g9t0fumQij2iO2Lr7s5awP7d7g/file?c_luid=dd54889a' \
            --output content/published/files/technical-notes/ancova-randomization-interval/v1.0.pdf
          echo '9b552fc60a6059fc3f1c7ef8390b614c78353919a45c6aea89c812b7ee9fb238  content/published/files/technical-notes/ancova-randomization-interval/v1.0.pdf' | sha256sum -c -
      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/published/files/technical-notes/ancova-randomization-interval/v1.0.pdf
          git commit -m 'Add TA-2026-015 technical note PDF'
          git push origin HEAD:publish-ta-2026-015
